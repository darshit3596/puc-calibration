<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diesel AMC Certificate - Shreeji</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../stye/diesel-amc.css" />
  </head>
  <body>
    <!-- 1. COMPACT HEADER -->
    <header class="app-header">
      <div class="header-container">
        <div class="header-left">
          <a href="../index.html" class="back-link" title="Return to Dashboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back</span>
          </a>
          <div class="header-title-group">
            <h1 class="h1">PUC CALIBRATION SHREEJI</h1>
            <span class="badge-amc">Diesel AMC</span>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. DATE CONTROLS & DOWNLOAD BAR -->
    <nav class="controls-bar">
      <div class="controls-container">
        <!-- Start Date (Sets Issue Date & Contract Start Date) -->
        <div class="input-group">
          <label for="date">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Start Date (From):
          </label>
          <input
            type="date"
            id="date"
            class="dt"
            onchange="formatDate()"
            aria-label="Start Date and Issue Date"
          />
        </div>

        <!-- End Date (Sets Contract End Date) -->
        <div class="input-group">
          <label for="date1" class="lb">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            End Date (To):
          </label>
          <input
            type="date"
            id="date1"
            class="dt"
            onchange="formatDate1()"
            aria-label="Contract End Date"
          />
        </div>

        <!-- Tool Button to Open Adjuster Panel -->
        <button type="button" class="btn-tool" onclick="toggleAdjuster()" title="Open Date Position Adjuster">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Adjust Position</span>
        </button>

        <button type="submit" id="printpdf" onclick="downloadCertificate()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          DOWNLOAD
        </button>
      </div>
    </nav>

    <!-- 3. CERTIFICATE DOCUMENT WORKSPACE -->
    <main class="preview-workspace">
      <div class="certificate-viewport">
        <div class="certificate-sheet">
          <!-- Top Date (DATE:) -->
          <p id="Starting">
            <b><i><span id="formattedDate"></span></i></b>
          </p>

          <!-- Contract Start Date (FROM :) -->
          <p id="StartingFrom">
            <b><span id="formattedDate_from"></span></b>
          </p>

          <!-- Contract End Date (TO :) -->
          <p id="StartingTo">
            <b><span id="formattedDate_to"></span></b>
          </p>

          <div class="img">
            <img src="../svg/DIESEL-AMC.svg" alt="DIESEL AMC" id="photo" class="certificate-img" />
          </div>
        </div>
      </div>
    </main>

    <!-- 4. LIVE POSITION ADJUSTER (Screen Only) -->
    <aside class="position-adjuster screen-only" id="adjusterPanel">
      <div class="adjuster-header">
        <span>🛠️ AMC Date Position Adjuster</span>
        <button type="button" class="toggle-btn" onclick="toggleAdjuster()" title="Close Panel">×</button>
      </div>
      <div class="adjuster-body" id="adjusterBody">
        <!-- Top Date (DATE:) -->
        <div class="adjuster-group">
          <strong>Top Date (DATE:):</strong>
          <div class="coords-row">
            <span>Top: <input type="number" id="Starting_topInput" value="251" onchange="updatePos('Starting', 'top', this.value)"> px</span>
            <button type="button" onclick="nudge('Starting', 'top', -1)" title="Move 1px Up">▲</button>
            <button type="button" onclick="nudge('Starting', 'top', 1)" title="Move 1px Down">▼</button>
          </div>
          <div class="coords-row">
            <span>Left: <input type="number" id="Starting_leftInput" value="614" onchange="updatePos('Starting', 'left', this.value)"> px</span>
            <button type="button" onclick="nudge('Starting', 'left', -1)" title="Move 1px Left">◀</button>
            <button type="button" onclick="nudge('Starting', 'left', 1)" title="Move 1px Right">▶</button>
          </div>
        </div>

        <hr style="border: 0.5px solid #e2e8f0; margin: 4px 0;" />

        <!-- Contract Start Date (FROM :) -->
        <div class="adjuster-group">
          <strong>Start Date (FROM :):</strong>
          <div class="coords-row">
            <span>Top: <input type="number" id="StartingFrom_topInput" value="340" onchange="updatePos('StartingFrom', 'top', this.value)"> px</span>
            <button type="button" onclick="nudge('StartingFrom', 'top', -1)" title="Move 1px Up">▲</button>
            <button type="button" onclick="nudge('StartingFrom', 'top', 1)" title="Move 1px Down">▼</button>
          </div>
          <div class="coords-row">
            <span>Left: <input type="number" id="StartingFrom_leftInput" value="532" onchange="updatePos('StartingFrom', 'left', this.value)"> px</span>
            <button type="button" onclick="nudge('StartingFrom', 'left', -1)" title="Move 1px Left">◀</button>
            <button type="button" onclick="nudge('StartingFrom', 'left', 1)" title="Move 1px Right">▶</button>
          </div>
        </div>

        <hr style="border: 0.5px solid #e2e8f0; margin: 4px 0;" />

        <!-- Contract End Date (TO :) -->
        <div class="adjuster-group">
          <strong>End Date (TO :):</strong>
          <div class="coords-row">
            <span>Top: <input type="number" id="StartingTo_topInput" value="355" onchange="updatePos('StartingTo', 'top', this.value)"> px</span>
            <button type="button" onclick="nudge('StartingTo', 'top', -1)" title="Move 1px Up">▲</button>
            <button type="button" onclick="nudge('StartingTo', 'top', 1)" title="Move 1px Down">▼</button>
          </div>
          <div class="coords-row">
            <span>Left: <input type="number" id="StartingTo_leftInput" value="83" onchange="updatePos('StartingTo', 'left', this.value)"> px</span>
            <button type="button" onclick="nudge('StartingTo', 'left', -1)" title="Move 1px Left">◀</button>
            <button type="button" onclick="nudge('StartingTo', 'left', 1)" title="Move 1px Right">▶</button>
          </div>
        </div>
        
        <div class="adjuster-actions">
          <button type="button" class="save-btn" onclick="savePositions()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Save Position
          </button>
          <div id="saveSuccessMsg" class="success-toast">✅ Position Saved Successfully!</div>
          <button type="button" class="reset-btn" onclick="resetPositions()">Reset Defaults</button>
        </div>
      </div>
    </aside>

    <!-- 5. FOOTER -->
    <footer class="footer">
      <div class="footer-content">
        <p class="developer-text">Developed by Sapariya Darshit</p>
        <p class="contact-wrapper">
          <span>Contact:</span>
          <a
            href="https://wa.me/918347402205"
            target="_blank"
            rel="noopener noreferrer"
            class="contact-link"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
            Click Me
          </a>
        </p>
      </div>
    </footer>

    <script src="../app.js"></script>
  </body>
</html>
